# Copy this file to k8s/notesbhej-secrets.yaml, replace every value, and apply it.
# Do not commit the copied file.
apiVersion: v1
kind: Secret
metadata:
  name: notesbhej-app-secrets
  namespace: notesbhej
type: Opaque
stringData:
  JWT_SECRET: REPLACE_WITH_A_LONG_RANDOM_PRODUCTION_SECRET
  SPRING_DATASOURCE_USERNAME: REPLACE_ME
  SPRING_DATASOURCE_PASSWORD: REPLACE_ME
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: REPLACE_ME
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: REPLACE_ME
  # These are still required by the current S3Config bean even when APP_USE_DEV=false.
  MINIO_ACCESS_KEY: REPLACE_ME
  MINIO_SECRET_KEY: REPLACE_ME
  R2_ACCESS_KEY: REPLACE_ME
  R2_SECRET_KEY: REPLACE_ME
