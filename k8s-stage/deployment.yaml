apiVersion: apps/v1
kind: Deployment
metadata:
  name: notesbhej-api-stage
  namespace: notesbhej-stage
  labels:
    app.kubernetes.io/name: notesbhej-api-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notesbhej-api-stage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notesbhej-api-stage
    spec:
      containers:
        - name: api
          image: docker.io/manojthedonut/notesbhej-api:stage
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: notesbhej-stage-config
            - secretRef:
                name: notesbhej-stage-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 30
